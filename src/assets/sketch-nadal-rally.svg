<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <radialGradient id="paperDark" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#17191c"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <radialGradient id="watercolorCyan" cx="35%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="watercolorAmber" cx="70%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#paperDark)"/>
  <rect width="1200" height="750" fill="url(#watercolorCyan)"/>
  <rect width="1200" height="750" fill="url(#watercolorAmber)"/>

  <!-- Manga Panel Borders (Stacked Composition Study) -->
  <g stroke="#e4e4e7" stroke-width="3" stroke-opacity="0.85">
    <rect x="70" y="60" width="520" height="630" rx="4" fill="#090a0c" fill-opacity="0.45"/>
    <polygon points="620,60 1130,60 1130,360 590,390" fill="#090a0c" fill-opacity="0.55"/>
    <polygon points="590,415 1130,385 1130,690 620,690" fill="#090a0c" fill-opacity="0.55"/>
  </g>

  <!-- Left Panel: Expressive Watercolor & Ink Athlete Silhouette + Racquet Kinetic Arc -->
  <g>
    <!-- Kinetic Serve / Forehand Motion Sweep -->
    <path d="M120 520 Q310 140 540 240" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M135 545 Q320 175 555 265" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="10 8" stroke-linecap="round"/>

    <!-- Ink Cross-Hatch Portrait & Bandana Silhouette -->
    <path d="M230 250 L435 235 L450 268 L220 282 Z" fill="#00F0FF" fill-opacity="0.85"/>
    <path d="M435 245 C475 230 510 255 530 285 C495 275 465 268 440 265 Z" fill="#00F0FF"/>
    <!-- Expressive Ink Linework Face & Roar Expression -->
    <path d="M250 280 C245 360 265 435 330 465 C395 435 415 360 410 280" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Intense Brow & Eyes -->
    <path d="M275 315 L320 328 M390 315 L345 328" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Mid-Roar Open Mouth Ink Shading -->
    <path d="M302 378 Q332 368 362 378 L356 424 Q332 438 308 424 Z" fill="#ffffff" stroke="#00F0FF" stroke-width="2"/>
    <line x1="312" y1="392" x2="352" y2="392" stroke="#090a0c" stroke-width="3"/>
    <!-- Cross-hatch neck/shoulder lines -->
    <g stroke="#a1a1aa" stroke-width="1.5" stroke-opacity="0.7">
      <line x1="210" y1="480" x2="290" y2="450"/>
      <line x1="215" y1="500" x2="310" y2="465"/>
      <line x1="220" y1="520" x2="330" y2="480"/>
      <line x1="450" y1="480" x2="370" y2="450"/>
      <line x1="460" y1="505" x2="355" y2="468"/>
      <!-- Tennis Racquet Isometric Grid -->
      <ellipse cx="470" cy="175" rx="52" ry="68" transform="rotate(28 470 175)" stroke="#F59E0B" stroke-width="4"/>
      <line x1="435" y1="230" x2="385" y2="315" stroke="#F59E0B" stroke-width="5"/>
    </g>
    <text x="105" y="655" font-family="JetBrains Mono, monospace" font-size="13" fill="#00F0FF" letter-spacing="2">FIG. 01 // WATERCOLOUR WASH + INDIA INK ROAR STUDY</text>
  </g>

  <!-- Top Right Panel: Dense Manga Speed-Lines & Impact Frame -->
  <g>
    <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">
      <line x1="620" y1="80" x2="840" y2="210"/>
      <line x1="620" y1="140" x2="830" y2="215"/>
      <line x1="620" y1="220" x2="825" y2="225"/>
      <line x1="620" y1="310" x2="835" y2="235"/>
      <line x1="1110" y1="85" x2="900" y2="210"/>
      <line x1="1110" y1="160" x2="905" y2="220"/>
      <line x1="1110" y1="260" x2="900" y2="230"/>
      <line x1="1110" y1="335" x2="895" y2="240"/>
    </g>
    <!-- Spiky Manga Hair & Energy Aura Silhouette -->
    <polygon points="865,105 890,155 945,125 915,180 970,185 915,220 865,205 815,220 770,185 820,180 790,125 845,155" fill="#F59E0B" fill-opacity="0.85" stroke="#ffffff" stroke-width="2.5"/>
    <text x="645" y="348" font-family="JetBrains Mono, monospace" font-size="12" fill="#F59E0B" letter-spacing="2">FIG. 02 // DENSE MANGA PANEL FOCAL BURST</text>
  </g>

  <!-- Bottom Right Panel: Two-Tone High-Contrast Stencil Study -->
  <g>
    <circle cx="865" cy="540" r="95" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2"/>
    <path d="M865 445 A95 95 0 0 1 865 635 Z" fill="#00F0FF" fill-opacity="0.75"/>
    <path d="M865 475 A65 65 0 0 0 865 605 Z" fill="#ffffff"/>
    <text x="645" y="662" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7" letter-spacing="2">FIG. 03 // TWO-TONE NEGATIVE SPACE STENCIL</text>
  </g>
</svg>
