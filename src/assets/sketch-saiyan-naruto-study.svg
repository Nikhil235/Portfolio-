<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <radialGradient id="auraGold" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#5865F2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#09090d"/>
  <rect width="1200" height="750" fill="url(#auraGold)"/>

  <!-- Manga Split-Face & Trio Study Frame -->
  <rect x="75" y="65" width="1050" height="620" rx="12" fill="#0e0f14" stroke="#5865F2" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Left Panel: Saturated Marker Aura Trio Silhouette -->
  <g>
    <rect x="105" y="95" width="470" height="520" fill="#13141c" stroke="#27272a" stroke-width="1.5"/>
    <!-- Spiky Saiyan Crown Silhouettes in Marker Cyan, Gold, Coral -->
    <polygon points="340,145 375,235 455,180 410,275 495,280 405,335 340,315 275,335 185,280 270,275 225,180 305,235" fill="#F59E0B" fill-opacity="0.85" stroke="#ffffff" stroke-width="3"/>
    <polygon points="245,275 270,335 325,300 295,365 355,370 290,410 245,395 195,410 140,370 195,365 165,300 220,335" fill="#00F0FF" fill-opacity="0.75" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="435,275 460,335 515,300 485,365 545,370 480,410 435,395 385,410 330,370 385,365 355,300 410,335" fill="#EF4444" fill-opacity="0.75" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Speed lines -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5">
      <line x1="140" y1="580" x2="290" y2="430"/>
      <line x1="220" y1="590" x2="320" y2="440"/>
      <line x1="460" y1="590" x2="360" y2="440"/>
      <line x1="540" y1="580" x2="390" y2="430"/>
    </g>
    <text x="135" y="585" font-family="JetBrains Mono, monospace" font-size="12" fill="#F59E0B" letter-spacing="2">SATURATED ALCOHOL MARKER + INK CONTOUR</text>
  </g>

  <!-- Right Panel: Split-Face Pen Portrait Study -->
  <g>
    <rect x="615" y="95" width="480" height="520" fill="#13141c" stroke="#27272a" stroke-width="1.5"/>
    <!-- Vertical Split Line -->
    <line x1="855" y1="120" x2="855" y2="590" stroke="#5865F2" stroke-width="2.5" stroke-dasharray="6 6"/>

    <!-- Face Contour -->
    <path d="M720 220 C720 390 765 495 855 535 C945 495 990 390 990 220" stroke="#ffffff" stroke-width="3.5" fill="#181924"/>
    <!-- Headband -->
    <rect x="712" y="195" width="286" height="44" rx="4" fill="#27272a" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="815" y="203" width="80" height="28" rx="4" fill="#a1a1aa"/>
    <line x1="830" y1="217" x2="880" y2="217" stroke="#09090b" stroke-width="3"/>

    <!-- Eyes (Left: Sage/Normal, Right: Nine-Tails Slit) -->
    <ellipse cx="785" cy="305" rx="28" ry="14" fill="#ffffff" stroke="#09090b" stroke-width="2.5"/>
    <circle cx="785" cy="305" r="8" fill="#00F0FF"/>
    <ellipse cx="925" cy="305" rx="28" ry="14" fill="#F59E0B" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="925" y1="292" x2="925" y2="318" stroke="#09090b" stroke-width="4"/>

    <!-- Whisker Marks (3 on each cheek) -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="735" y1="365" x2="795" y2="375"/>
      <line x1="740" y1="392" x2="800" y2="398"/>
      <line x1="748" y1="418" x2="805" y2="420"/>
    </g>
    <g stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round">
      <line x1="975" y1="365" x2="915" y2="375"/>
      <line x1="970" y1="392" x2="910" y2="398"/>
      <line x1="962" y1="418" x2="905" y2="420"/>
    </g>

    <text x="645" y="585" font-family="JetBrains Mono, monospace" font-size="12" fill="#5865F2" letter-spacing="2">SPLIT-FACE DUAL FOCAL HIERARCHY STUDY</text>
  </g>
</svg>

